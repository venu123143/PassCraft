# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: passcraft-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/passcraft.db
      - key: DEFAULT_WALLET_PLATFORM
        value: google
      - key: GOOGLE_CLASS_SUFFIX
        value: passcraft_generic_v1
      - key: GOOGLE_CARD_TITLE
        value: PassCraft
      - key: GOOGLE_BACKGROUND_COLOR
        value: "#1a73e8"
      # Secrets / per-deployment values: set these in the Render dashboard.
      - key: GOOGLE_ISSUER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_LOGO_URL
        sync: false
      - key: WALLET_ORIGINS
        sync: false

  # Web client (static Vite build). Set VITE_API_BASE_URL to the API's public URL,
  # and add this site's URL to the API's CORS_ORIGINS.
  - type: web
    name: passcraft-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        sync: false
